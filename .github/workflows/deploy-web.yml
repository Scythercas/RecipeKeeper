name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'RecipeKeeper/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RecipeKeeper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RecipeKeeper/package-lock.json

      - run: npm ci

      - name: Set base path for GitHub Pages (project site is served at /<repo>/)
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json'));
            app.expo.experiments = app.expo.experiments || {};
            app.expo.experiments.baseUrl = '/${{ github.event.repository.name }}';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - run: npx expo export --platform web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: RecipeKeeper/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
